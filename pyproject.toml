[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "redtusk"
version = "0.1.1"
description = "Sandboxed Apache Tika service with warm-pool worker containers"
license = {text = "MIT"}
requires-python = ">=3.12"
# NOTE (supply chain): these constraints bound the resolver but are NOT a
# substitute for a hash-pinned lockfile. For reproducible, tamper-evident
# installs generate a locked, hashed manifest and install from it in the
# Docker images, e.g.:
#   uv lock                                         # -> uv.lock (preferred)
#   pip-compile --generate-hashes -o deploy/requirements.lock pyproject.toml
# then `pip install --require-hashes -r deploy/requirements.lock`.
# A `deploy/requirements.lock` produced via `pip freeze` is committed as a
# starting point; regenerate it WITH HASHES (pip-tools/uv) for production.
# Upper bounds cap the next major (or next minor for 0.x) to avoid silently
# pulling in breaking releases; the runtime dependency SET is unchanged.
# RedTusk now runs ON blastbox.host: it ships only the engine adapter
# (redtusk.engine), the ingress extension (redtusk.blastbox_ingress), a lean CLI,
# and structured logging. The bespoke FastAPI/dispatcher/jobs/pool host stack was
# deleted — its deps moved out. Core stays light so the cold worker can install
# it `--no-deps` on top of blastbox core (it imports only redtusk.engine).
dependencies = [
    "blastbox>=0.1.35,<0.2",
    "click>=8.1,<9.0",
    "structlog>=24.1.0,<26.0",
    "jsonschema>=4.0,<5.0",
]

[project.optional-dependencies]
# The api/dispatcher tier runs `blastbox serve` / `blastbox dispatch` and loads
# the ingress extension (which imports fastapi) — all provided by blastbox[host].
# `[s3]` (boto3) comes with it: on a multi-node fleet the dispatcher reads samples
# and seals results through an S3/MinIO BlobStore (BLASTBOX_BLOB_URL=s3://...), so
# it is a real dependency of this tier, not an image-build detail. Declaring it
# here rather than appending `blastbox[s3]` to the Dockerfile's pip line means a
# plain `pip install redtusk[host]` outside Docker resolves the same closure.
# Unset BLASTBOX_BLOB_URL simply leaves boto3 unused (local-filesystem blobs).
host = [
    "blastbox[host,s3]>=0.1.35,<0.2",
]
dev = [
    "blastbox[host,s3]>=0.1.35,<0.2",
    "pytest>=8.0.0,<9.0",
    "pytest-asyncio>=0.23.0,<1.0",
    "httpx>=0.27.0,<1.0",
    "ruff>=0.3.0,<1.0",
    "mypy>=1.9.0,<2.0",
    # Without this, `mypy src` under strict fails on jsonschema with import-untyped.
    "types-jsonschema>=4.0,<5.0",
    # Version/requirement parsing for the lock-vs-pyproject consistency tests.
    "packaging>=23.0,<27.0",
    # The compose-overlay tests parse YAML. Both are declared: pyyaml so the
    # tests can run at all, and the stubs so `mypy` does not fail on
    # import-untyped -- CI had the runtime but not the stubs, which a local
    # `type: ignore` would have papered over in one environment and broken in
    # the other.
    "pyyaml>=6.0,<7.0",
    "types-PyYAML>=6.0,<7.0",
]

[project.scripts]
redtusk = "redtusk.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

# Package the web UI assets (index.html + the assets/ subdir the blastbox
# StaticUI seam serves at GET / and /assets). Without this, pip install copies
# only the .py modules and the UI silently 404s (make_extension() sees no
# index.html → static_ui=None).
[tool.setuptools.package-data]
redtusk = ["static/index.html", "static/assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra -q"
markers = [
    "integration: requires running RedTusk + Tika instances (deselect with -m 'not integration')",
    "docker: requires Docker daemon and pre-built images (deselect with -m 'not docker')",
    "postgres: requires a running postgres instance",
    "jvm: requires JDK + maven",
]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
# tests/unit/test_fc_cpu_probe_cli.py imports fc_cpu_probe, which lives in scripts/ and is put
# on sys.path by the test itself. Without this mypy cannot follow that and reports
# import-not-found for a module that exists.
mypy_path = "scripts"

# These four are only imported by tests/fixtures/unicode_qr/generate.py, the one-shot generator
# for the QR corpus fixtures. None of them ship type information (docx and pptx have no stubs at
# all), and none are needed to RUN the suite -- only to regenerate fixtures. Ignoring the
# missing imports keeps the generator inside the type gate without adding four packages to every
# CI install for a script that runs about once a year.
[[tool.mypy.overrides]]
module = ["qrcode.*", "docx.*", "pptx.*", "fpdf.*"]
ignore_missing_imports = true
