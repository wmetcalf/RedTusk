# Declarative image chain for RedTusk warm/cold tiers.
#
#     BLASTBOX_SRC=/home/coz/bb-v0140 \
#     REDTUSK_FC_DIR=/home/coz/redtusk-bb-fc \
#     blastbox build-images /home/coz/redtusk-bb --tag <tag>     # --dry-run first
#
# The FC rootfs is an ext4 exported from an image. Exported by hand it drifts
# from the host tier and fails SILENTLY: the microVM boots, the guest never
# signals READY, every warm job dies on the 300s timeout, and the API keeps
# answering 200. That is what this deployment was doing before this file.
#
# $BLASTBOX_SRC must be a blastbox checkout at the SAME version pinned in
# deploy/requirements.lock -- the FC guest agent is installed from that tree.

[engine]
name = "redtusk"

# 1. Tika/JVM worker base (zxing + tika + the fat jar).
[[image]]
name       = "redtusk-worker"
dockerfile = "deploy/docker/Dockerfile.default"
base       = "eclipse-temurin:25-jre-jammy"
context    = "."
build_args = { JDK_BUILD_IMAGE = "eclipse-temurin:25-jdk-jammy", ZXING_BUILD_IMAGE = "ubuntu:jammy" }

# 2. Host/API tier: blastbox[host,s3] from the HASHED lock.
[[image]]
name       = "redtusk"
dockerfile = "deploy/docker/Dockerfile.host"
base       = "python:3.12-slim-bookworm"
context    = "."

# 3. Cold worker: blastbox core + the engine, on the JVM base.
[[image]]
name       = "redtusk-cold-worker"
dockerfile = "deploy/docker/Dockerfile.cold-worker"
base       = "redtusk-worker"
context    = "."
# BLASTBOX_VERSION is a SEPARATE pin from the lock: the cold worker installs
# blastbox --no-deps, so pyproject's floor never upgrades a stale default here.
# The verify step catches the mismatch (label says X, image contains Y).
build_args = { BLASTBOX_VERSION = "0.1.43" }

# 4. Firecracker guest: blastbox FC agent + /init, from blastbox's own deploy/.
[[image]]
name        = "redtusk-fc-worker"
dockerfile  = "deploy/firecracker/Dockerfile.redtusk"
base        = "redtusk-cold-worker"
context     = "$BLASTBOX_SRC"
source_repo = "$BLASTBOX_SRC"

# 5. The ext4 the microVM boots. `requires` refuses an image that cannot boot.
[[rootfs]]
kind     = "ext4"
image    = "redtusk-fc-worker"
dest     = "$REDTUSK_FC_DIR/redtusk-rootfs.ext4"
size_mib = 1536
requires = ["/init", "/opt/blastbox/run_guest.py"]

# gVisor warm guest: the KVM-less C/R tier, from blastbox's own deploy/gvisor/.
# base_arg is "BASE", NOT the default "BASE_IMAGE": blastbox's gVisor Dockerfiles use the
# short name, and docker silently discards a --build-arg a Dockerfile never declares.
[[image]]
name        = "redtusk-warm-gvisor"
dockerfile  = "deploy/gvisor/Dockerfile.redtusk"
base        = "redtusk-cold-worker"
base_arg    = "BASE"
context     = "$BLASTBOX_SRC"
source_repo = "$BLASTBOX_SRC"
build_args  = { ENGINE = "redtusk.engine:RedTuskEngine" }

# runsc restores a DIRECTORY tree. No /init: runsc launches BLASTBOX_GVISOR_WARM_ARGV.
# The default REDTUSK_GVISOR_DIR in compose is /var/lib/redtusk-gvisor.
[[rootfs]]
kind     = "dir"
image    = "redtusk-warm-gvisor"
dest     = "${REDTUSK_GVISOR_DIR:-/var/lib/redtusk-gvisor}/rootfs"
requires = ["/opt/blastbox/run_warm.py", "/opt/blastbox/engines.py", "/opt/blastbox/engine", "/in", "/out", "/ctrl"]
