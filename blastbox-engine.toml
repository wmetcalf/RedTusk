# RedTusk engine output contract (blastbox-engine-contract/1).
#
# Describes what src/redtusk/engine.py (RedTuskEngine.detonate) and the JVM worker it drives
# actually emit TODAY, on this branch. It is not a wish list: where the output cannot be mapped
# cleanly by a consumer, that is recorded under [[gaps]] rather than fixed here.
#
# Validate:  python -m blastbox.contract.engine_contract validate blastbox-engine.toml
# Check one: python -m blastbox.contract.engine_contract check blastbox-engine.toml metadata.json
schema = "blastbox-engine-contract/1"

[engine]
name = "redtusk"
formats = ["*"]
# The JVM runs in-process inside the socket-less cold worker; nothing in the engine needs egress
# (tests/integration/test_no_network_egress.py pins that under strace).
network = ["none"]
# No max_input_bytes: the engine enforces none (it reads the whole input into memory); the size
# cap is the host's Limits / the consumer's accept policy.
# The engine returns only "ok"; any exception (worker crash, timeout, missing or schema-invalid
# rmeta) propagates and the harness seals it as engine_error. There is no precheck, so the
# harness never produces "rejected" for this engine.
statuses = ["ok", "engine_error"]

# --- Declared artifacts ------------------------------------------------------------------------
# Every file the JVM writes under <outdir>/rmeta/ is declared, except rmeta/metadata.json (its
# content is embedded in the payload as redtusk_rmeta). The id is the path with every character
# outside [A-Za-z0-9._-] mapped to "_" (so normally "rmeta_..."), but an over-long path keeps
# only its tail plus a 16-hex hash and collisions get a "_N" suffix, so ids are matched with "*".
# Kind comes from _infer_artifact_kind(path), which looks only at the file NAME: any path with
# "thumbnail" in it or ending .jpg/.jpeg is "thumbnail", else ".txt" is "text", else "output".
# fnmatch "*" crosses "/", and families are matched in order, so the specific ones come first.

[[artifacts]]
id = "*"
path = "rmeta/embedded/thumbnails/*.jpg"
kind = "thumbnail"
max_count = 10000
role = "embedded_thumbnail"
description = "256px JPEG thumbnail of an embedded image, at embedded/thumbnails/<embedded rel path>.jpg. Only when enable_thumbnails (default on)."

[[artifacts]]
id = "*"
path = "rmeta/thumbnail.jpg"
kind = "thumbnail"
max_count = 1
role = "root_thumbnail"
description = "Thumbnail of the submitted file itself, only when the root content type is image/* and decodes."

[[artifacts]]
id = "*"
path = "rmeta/embedded/*"
kind = "output"
max_count = 10000
max_bytes = 52428800
role = "embedded_file"
description = "Raw bytes of one embedded resource (pass-1 image capture or pass-2 SavingExtractor), at a sanitized path mirroring the entry path. Read capped at 50 MiB per file, 256 MiB per pass."

[[artifacts]]
id = "*"
path = "rmeta/embedded/*"
kind = "thumbnail"
max_count = 10000
max_bytes = 52428800
role = "embedded_file"
description = "An embedded resource whose NAME ends .jpg/.jpeg or contains 'thumbnail' (gap kind-from-filename): the raw embedded bytes, not a thumbnail."

[[artifacts]]
id = "*"
path = "rmeta/embedded/*"
kind = "text"
max_count = 10000
max_bytes = 52428800
role = "embedded_file"
description = "An embedded resource whose name ends .txt (gap kind-from-filename): the raw embedded bytes."

[[artifacts]]
id = "*"
path = "rmeta/.metadata.json.draft.tmp"
kind = "output"
max_count = 1
role = "draft_leftover"
description = "In-flight draft-snapshot temp file left by a warm or CRaC JVM that died mid-write, when the engine then re-runs the job cold into the same rmeta/ dir (gap fallback-reuses-rmeta-dir)."

# --- Payload -----------------------------------------------------------------------------------

[payload]
# The tree rebuilt from rmeta extraction.entries[] (depth-ordered, depth-stack assembly). The root
# is the submitted file ("/", depth 0); each entry's non-empty text is an ExtractedText child.
# Per-entry scalars (sha256, md5, sha1, size_bytes, language, error, phash, colorhash) and the
# Tika metadata keys live in EmbeddedResource.metadata (a Record, not a child node). The root's
# metadata also carries redtusk_rmeta, the full rmeta document as a JSON string.
root = "embedded_resource"
node_types = ["embedded_resource", "extracted_text"]
# Checked on the root EmbeddedResource's metadata Record (ok results only). size_bytes: the rmeta
# schema requires an integer size_bytes on the root entry and _build_tree copies it whenever it is
# not None. redtusk_rmeta: detonate() sets it unconditionally on every ok result; if the rmeta
# doc cannot be serialized the value is "" and the result carries warning rmeta_embed_failed
# (tests/unit/test_engine_envelope.py drives that branch). No schema_version: neither field
# carries one.
required_root_fields = ["size_bytes", "redtusk_rmeta"]

# --- Findings a consumer is expected to turn into detections -----------------------------------
# RedTusk is an extractor. Its findings are (a) two envelope warnings with stable codes and
# (b) Tika-fork / RTF-scanner metadata keys with stable NAMES on EmbeddedResource.metadata.fields.
# For (b) the code below is the metadata key; the value is evidence (URL, path, list, flag or,
# for ExploitClass, free text).

[[detections]]
code = "truncated"
severity = "medium"
source = "envelope warnings[] code=truncated (from rmeta.truncated; reason/limit/observed only inside the message text)"
description = "Extraction stopped at max_embedded_entries / max_recursion_depth / max_extracted_bytes; the tree is incomplete."

[[detections]]
code = "partial_extraction"
severity = "medium"
source = "envelope warnings[] code=partial_extraction; root EmbeddedResource.metadata.fields.error carries the parser exception"
description = "The parser crashed mid-document; the entries emitted before the crash were salvaged."

[[detections]]
code = "rtf:templateUrl"
severity = "high"
source = "root EmbeddedResource.metadata.fields['rtf:templateUrl'] (RtfIocScanner, root RTF only)"
description = "Remote (UNC / http / ftp) attached template: the template-injection delivery technique."

[[detections]]
code = "rtf:protocolHandler"
severity = "high"
source = "root EmbeddedResource.metadata.fields['rtf:protocolHandler']"
description = "ms-msdt: / search-ms: / mhtml: / smb:// protocol-handler URI in the RTF (Follina class)."

[[detections]]
code = "rtf:nullByteUrl"
severity = "high"
source = "root EmbeddedResource.metadata.fields['rtf:nullByteUrl']"
description = "URL or UNC path hidden behind null-byte obfuscation."

[[detections]]
code = "rtf:uncPath"
severity = "medium"
source = "root EmbeddedResource.metadata.fields['rtf:uncPath']"
description = "UNC path reference (NTLM-leak / remote-load vector)."

[[detections]]
code = "rtf:hyperlinkUrl"
severity = "low"
source = "root EmbeddedResource.metadata.fields['rtf:hyperlinkUrl']"
description = "HYPERLINK field target URL."

[[detections]]
code = "rtf:objdataMixedCase"
severity = "medium"
source = "root EmbeddedResource.metadata.fields['rtf:objdataMixedCase']"
description = "Mixed-case \\objdata control word, an evasion of naive OLE-object signatures."

[[detections]]
code = "ExploitClass"
severity = "high"
source = "any EmbeddedResource.metadata.fields['ExploitClass'] (Tika fork parsers; also the Unicode-art QR decoder)"
description = "Tika-fork exploit / evasion classification. The KEY is stable; the value is free text (gap exploitclass-free-text)."

[[detections]]
code = "msoffice:ooxml:ole-suspicious-progids"
severity = "medium"
source = "any EmbeddedResource.metadata.fields['msoffice:ooxml:ole-suspicious-progids'] (list of ProgIDs)"
description = "OOXML embeds an OLE object with a ProgID on the fork's suspicious list."

[[detections]]
code = "msoffice:excel:has-xls4-macros"
severity = "medium"
source = "any EmbeddedResource.metadata.fields['msoffice:excel:has-xls4-macros'] (names in msoffice:excel:xls4-macro-sheet-names)"
description = "Legacy XLS4 / XLM macro sheets present."

[[detections]]
code = "msoffice:xlsx:has-xlm-macros"
severity = "medium"
source = "any EmbeddedResource.metadata.fields['msoffice:xlsx:has-xlm-macros'] (and msoffice:xlsb:has-xlm-macros for XLSB)"
description = "XLM macro sheets present in an OOXML / XLSB workbook."

[[detections]]
code = "qr_code"
severity = "info"
source = "ONLY inside payload root metadata.fields.redtusk_rmeta (JSON string): extraction.entries[].qr.codes[].data"
description = "Decoded QR / barcode payload (commonly a phishing URL). Not in the typed tree (gap qr-only-in-rmeta-string)."

# --- Gaps --------------------------------------------------------------------------------------

[[gaps]]
id = "qr-only-in-rmeta-string"
description = "QR decodes, OCR results, parent_path, has_thumbnail/thumbnail_skipped and text_wsnorm are dropped by _build_tree; they exist only inside the redtusk_rmeta JSON string, so a consumer walking the typed tree never sees them."

[[gaps]]
id = "contract-cannot-require-rmeta-field"
description = "redtusk_rmeta is required (checked on the root's metadata fields), but its value is unchecked: a JSON string with no schema version, and it is \"\" (with warning rmeta_embed_failed) if json.dumps raises TypeError/ValueError. That fallback is unreachable today (the input is json.loads output, so no cycles or non-str keys; default=str; allow_nan stays True) but is enforced in code and tested, so a consumer must treat \"\" as absent rather than parse it. A RecursionError propagates as engine_error, never an ok result. Other root fields (sha256 may be null, Tika keys vary by format) cannot be required."

[[gaps]]
id = "exploitclass-free-text"
description = "ExploitClass is a single free-text string (e.g. 'Decoded N Unicode-art QR code(s) ...'); a later setter overwrites an earlier one, and there is no stable sub-code a consumer can key severity on."

[[gaps]]
id = "detections-are-metadata-keys"
description = "Every finding except the two warnings is a Tika metadata key mixed in with thousands of ordinary keys on EmbeddedResource.metadata; there is no findings list, severity or code namespace, and the RTF keys are emitted only for the root entry."

[[gaps]]
id = "kind-from-filename"
description = "_infer_artifact_kind sees the 'rmeta/...' path, so its embedded/ branch is dead and kind 'embedded_file' is never emitted; embedded files get 'output', or 'thumbnail' / 'text' purely from their name (an embedded photo.jpg is declared kind thumbnail). Role must be read from the path prefix, not the kind."

[[gaps]]
id = "cr-tier-drops-thumbnails"
description = "On a gVisor C/R-restored worker with a stale directory view, the declaration is rebuilt from rmeta entries and covers only embedded/<entry> files: embedded thumbnails and rmeta/thumbnail.jpg are not declared there."

[[gaps]]
id = "fallback-reuses-rmeta-dir"
description = "A failed CRaC or warm attempt falls back to a cold JVM writing into the SAME rmeta/ dir without clearing it, so partial files from the failed attempt (embedded files, a draft temp) are declared alongside the cold result."

[[gaps]]
id = "silent-size-caps"
description = "An embedded file over 50 MiB is truncated to 50 MiB, entries past the 256 MiB per-pass byte budget are skipped, and Record metadata past 4000 keys is dropped, all with no warning in the result (worker log only)."

[[gaps]]
id = "truncated-warning-unstructured"
description = "The truncated warning carries reason/limit/observed only as text in its message; the structured rmeta.truncated object survives only inside the redtusk_rmeta string."

[[gaps]]
id = "detected-is-root-mime"
description = "detected is the root content type with confidence 1.0 on every result; it is identification, not a verdict, and says nothing about the findings."

[[gaps]]
id = "local-main-diverges"
description = "This contract is written against origin/main (3414567). Local unpushed commits (fix/rar5-worker-extraction lineage, e48433b) add payload.metadata.fields.embedded_paths and archive ancestry; those are not described here."

# Loadout-side mismatches (consumer = backend/loadout/engines.py in loadout_handoff_package).

[[gaps]]
id = "loadout-embedded-paths-absent"
description = "redtusk_map_outputs reads payload.metadata.fields.embedded_paths to map entries to declared files; this engine never emits it, so the mapper always falls back to rmeta/embedded/<path> and unique-sha256 correlation, which misses lossy-sanitized names."

[[gaps]]
id = "loadout-envelope-drops-findings"
description = "With an envelope Loadout sets dets=[] for redtusk and never reads ExploitClass, rtf:*, msoffice:* or the partial_extraction warning; extraction_evidence only marks coverage incomplete on 'truncated' and fields.error. redtusk_status_to_detections reads the legacy result.extraction shape and only runs without an envelope."

[[gaps]]
id = "loadout-ignores-rmeta-and-qr"
description = "Loadout never parses redtusk_rmeta, so QR-decoded URLs, OCR text and parent_path are lost; URLs are only regex-scraped from ExtractedText. The manifest also does not list qr_code in emits."

[[gaps]]
id = "loadout-thumbnails-as-resources"
description = "redtusk_map_outputs keys only on the rmeta/embedded/ path prefix (never on kind): embedded thumbnails are ingested as tika_resource file artifacts with embedded_path '/thumbnails/...', and rmeta/thumbnail.jpg is ingested as a plain file artifact."

[[gaps]]
id = "loadout-caps-below-engine"
description = "redtusk_map_outputs refuses the WHOLE result past 256 declarations, any artifact over 25 MiB (engine allows 50 MiB), 100 MiB combined, ExtractedText over 1 MiB (engine allows 10M chars), 256 text nodes, or 10000 tree nodes; the engine legitimately produces up to 10000 entries plus their text nodes and thumbnails."

[[gaps]]
id = "loadout-emits-script-never-produced"
description = "Loadout's EngineManifest emits 'script' for redtusk, but redtusk_map_outputs only creates file, text_message and url artifacts (macro parts arrive as plain files or text)."

[[gaps]]
id = "loadout-param-bounds"
description = "Loadout's config fields allow REDTUSK_MAX_EMBEDDED_ENTRIES up to 100000 (default 1000) and depth up to 50; the engine clamps entries to [0,10000] (default 5000) and depth to [0,64] (default 10), so values above 10000 are silently clamped."

# --- Consumers ---------------------------------------------------------------------------------

[[consumers]]
name = "loadout"
engine = "redtusk"
mapper = "backend/loadout/engines.py:redtusk_map_outputs"
emits = ["file", "text_message", "script", "url", "detection"]

[[consumers]]
name = "loadout"
engine = "redtusk"
mapper = "backend/loadout/engines.py:redtusk_status_to_detections"
emits = ["detection"]
