name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Cheap, runs before anything installs: every Dockerfile that CLONES the Tika fork
      # must pin the same commit. They drifted to THREE different values once
      # (c4bcec9f / de08f007 / 74997d72), so crac, localsrc and localtika were each
      # building a different parser set while looking uniform. Nothing compared them, so
      # nothing caught it -- for weeks.
      - name: tika pin consistency
        run: ./scripts/check_tika_pins.sh
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # `[dev]` is not optional here. mypy without the package's own dependencies reports
      # import-not-found for click/fastapi/structlog and then untyped-decorator for every
      # function they decorate -- 11 errors that are all one missing install and say nothing
      # about the code. No `|| true`: an env that failed to build must fail the job, not run
      # the gates against a half-installed tree and call the result green.
      - name: install
        run: |
          python -m pip install -q --upgrade pip
          python -m pip install -q -e ".[dev]"
      # scripts/ and deploy/ are in the gate because they are not scratch: submit_corpus.py
      # drives every fleet corpus run and the inventory_*.py trio produces the metadata
      # inventory. They were unlinted until 2026-08-20 and had 45 violations.
      - name: ruff
        run: ruff check src tests scripts deploy
      # Both, since 2026-08-20. tests/ used to report 178 errors under strict and I argued for
      # leaving it out; that was mostly wrong. 125 were missing annotations (mechanical), and the
      # rest resolved into real fixes rather than ceremony -- see the commit for the two that
      # were actual defects. Where a fake genuinely stands in for a real type the call is an
      # explicit cast() with a comment, which documents the substitution instead of hiding it.
      - name: mypy
        run: mypy src tests
      # tests/http and tests/docker are excluded on purpose, not to dodge failures:
      # http needs a starlette/httpx pair this image does not pin, and docker needs a built
      # local image. Both are run by hand against a real environment. tests/unit and
      # tests/integration are the ones that mean anything without a fleet.
      - name: pytest
        run: pytest tests/unit tests/integration -q

  worker-jvm:
    # The check that matters most, and the one this repo did not have: build the worker against
    # the PINNED Tika rather than whatever is in a developer's ~/.m2. On 2026-08-19 a local
    # `mvn test` was green against Tika 3.0.0 while the image shipped 4.0.0-SNAPSHOT, so code
    # that compiled locally failed inside the image build and 26 "passing" tests said nothing
    # about the artifact.
    #
    # Deliberately NOT cached. The first version of this job restored /tmp/.buildx-cache, which
    # did exactly nothing: worker_build.sh runs a plain `docker build`, with no buildx driver and
    # no --cache-from/--cache-to, so the step archived an empty directory while looking like the
    # Tika compile was being cached. Measured cost of the honest version: 3m58s. Cache it only
    # by making the build actually consume one.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: worker build + tests, inside the pinned-Tika stage image
        run: scripts/worker_build.sh test
